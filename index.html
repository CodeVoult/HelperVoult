    <style>

        .footer .key-hint kbd { background:rgba(255,255,255,0.06); padding:1px 10px; border-radius:4px; font-family:inherit; font-size:11px; color:#8b93b5; }
        .toast-container { position:fixed; bottom:32px; right:32px; display:flex; flex-direction:column; gap:10px; z-index:999; pointer-events:none; }
        .toast { background:rgba(14,17,26,0.88); backdrop-filter:blur(28px); border:1px solid rgba(255,255,255,0.06); padding:14px 28px; border-radius:var(--radius-sm); color:#e4e8f5; font-weight:500; font-size:14px; box-shadow:0 12px 48px rgba(0,0,0,0.7); transform:translateX(60px) scale(0.96); opacity:0; transition:all 0.4s cubic-bezier(0.16,1,0.3,1); pointer-events:auto; display:flex; align-items:center; gap:12px; min-width:220px; }
        .toast.show { transform:translateX(0) scale(1); opacity:1; }
        .toast.success { border-left:3px solid #4ade80; }
        .toast.error { border-left:3px solid #f87171; }
        .toast .toast-icon { font-size:18px; }
        @media (max-width:600px) {
            .header { flex-direction:column; align-items:flex-start; }

            .btn-group .btn { flex:1; justify-content:center; }

        }
        @media (max-width:400px) {
            .logo-text { font-size:20px; }
            .header-badge { font-size:11px; padding:4px 12px; }
            .option-group label { font-size:12px; }
        }

<body>
    <div class="app">

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ================== CONFIGURACIÓN ==================
            const KEYWORDS = new Set([
                'and', 'break', 'do', 'else', 'elseif', 'end', 'false', 'for',
                'function', 'goto', 'if', 'in', 'local', 'nil', 'not', 'or',
                'repeat', 'return', 'then', 'true', 'until', 'while'
            ]);
            const BUILTINS = new Set([
                '_G', '_VERSION', 'arg', 'assert', 'collectgarbage', 'coroutine',
                'debug', 'dofile', 'error', 'getfenv', 'getmetatable', 'io',
                'ipairs', 'load', 'loadfile', 'loadstring', 'math', 'next', 'os',
                'package', 'pairs', 'print', 'rawequal', 'rawget', 'rawlen',
                'rawset', 'select', 'setfenv', 'setmetatable', 'string', 'table',
                'tonumber', 'tostring', 'type', 'xpcall', 'utf8', 'wait', 'tick',
                'spawn', 'delay', 'task', 'Instance', 'game', 'workspace', 'script'
            ]);
            const RESERVED = new Set([...KEYWORDS, ...BUILTINS]);

            // ================== TOKENIZER ==================
            function tokenize(code) {
                const tokens = [];
                let i = 0;
                const n = code.length;

                while (i < n) {
                    const ch = code[i];
                    // Espacios
                    if (/\s/.test(ch)) {
                        let val = '';
                        while (i < n && /\s/.test(code[i])) { val += code[i]; i++; }
                        tokens.push({ type: 'WHITESPACE', value: val });
                        continue;
                    }
                    // Comentarios
                    if (ch === '-' && i + 1 < n && code[i + 1] === '-') {
                        const next2 = (i + 2 < n) ? code[i + 2] : '';
                        if (next2 === '[' && i + 3 < n && code[i + 3] === '[') {
                            const start = i;
                            i += 4;
                            while (i + 1 < n && !(code[i] === ']' && code[i + 1] === ']')) i++;
                            i += 2;
                            tokens.push({ type: 'COMMENT', value: code.substring(start, i) });
                            continue;
                        } else {
                            const start = i;
                            i += 2;
                            while (i < n && code[i] !== '\n' && code[i] !== '\r') i++;
                            tokens.push({ type: 'COMMENT', value: code.substring(start, i) });
                            continue;
                        }
                    }
                    // Strings
                    if (ch === '"' || ch === "'") {
                        const quote = ch;
                        const start = i;
                        i++;
                        while (i < n && code[i] !== quote) {
                            if (code[i] === '\\' && i + 1 < n) i += 2;
                            else i++;
                        }
                        if (i < n && code[i] === quote) i++;
                        tokens.push({ type: 'STRING', value: code.substring(start, i) });
                        continue;
                    }
                    // Long string [[ ... ]]
                    if (ch === '[' && i + 1 < n && code[i + 1] === '[') {
                        const start = i;
                        i += 2;
                        while (i + 1 < n && !(code[i] === ']' && code[i + 1] === ']')) i++;
                        i += 2;
                        tokens.push({ type: 'STRING', value: code.substring(start, i) });
                        continue;
                    }
                    // Números
                    if (/[0-9]/.test(ch) || (ch === '.' && i + 1 < n && /[0-9]/.test(code[i + 1]))) {
                        let val = '';
                        while (i < n && /[0-9a-fA-FxX.]/.test(code[i])) { val += code[i]; i++; }
                        tokens.push({ type: 'NUMBER', value: val });
                        continue;
                    }
                    // Identificadores
                    if (/[a-zA-Z_]/.test(ch)) {
                        let val = '';
                        while (i < n && /[a-zA-Z0-9_]/.test(code[i])) { val += code[i]; i++; }
                        tokens.push({ type: 'IDENTIFIER', value: val });
                        continue;
                    }
                    // Símbolos multi-carácter
                    const multi = { '~=':true, '>=':true, '<=':true, '==':true, '..':true, '...':true, '<<':true, '>>':true, '//':true };
                    if (i + 1 < n) {
                        const two = ch + code[i + 1];
                        if (multi[two]) {
                            tokens.push({ type: 'SYMBOL', value: two });
                            i += 2;
                            continue;
                        }
                    }
                    tokens.push({ type: 'SYMBOL', value: ch });
                    i++;
                }
                return tokens;
            }

            // ================== OFUSCADOR PRINCIPAL ==================
            function obfuscate(code, opts) {
                const tokens = tokenize(code);
                const output = [];
                const renameMap = new Map();
                let nextId = 0;
                let lastToken = null;

                // ---- PASADA 1: Recolectar nombres locales y funciones ----
                if (opts.rename) {
                    for (let idx = 0; idx < tokens.length; idx++) {
                        const t = tokens[idx];
                        // local VAR
                        if (t.type === 'IDENTIFIER' && t.value === 'local') {
                            let j = idx + 1;
                            while (j < tokens.length && tokens[j].type === 'WHITESPACE') j++;
                            if (j < tokens.length && tokens[j].type === 'IDENTIFIER') {
                                const name = tokens[j].value;
                                if (!RESERVED.has(name) && !renameMap.has(name)) {
                                    renameMap.set(name, generateConfusingName(nextId++));
                                }
                            }
                        }
                        // function NAME
                        if (t.type === 'IDENTIFIER' && t.value === 'function') {
                            let j = idx + 1;
                            while (j < tokens.length && tokens[j].type === 'WHITESPACE') j++;
                            if (j < tokens.length && tokens[j].type === 'IDENTIFIER') {
                                const name = tokens[j].value;
                                if (!RESERVED.has(name) && !renameMap.has(name)) {
                                    renameMap.set(name, generateConfusingName(nextId++));
                                }
                            }
                        }
                    }
                }

                // ---- PASADA 2: Generar salida ----
                let functionDepth = 0;
                let inFunction = false;
                const deadPool = generateDeadCodePool();

                for (let idx = 0; idx < tokens.length; idx++) {
                    const t = tokens[idx];

                    // Minificar: saltar comentarios
                    if (opts.minify && t.type === 'COMMENT') {
                        continue;
                    }

                    // Inyección de código muerto al inicio de funciones (si está activado)
                    if (opts.deadCode && t.type === 'IDENTIFIER' && t.value === 'function') {
                        functionDepth++;
                        inFunction = true;
                        // Insertar código muerto justo después de la declaración de función
                        output.push(t.value);
                        // Buscar el paréntesis de parámetros y el 'end' para insertar al inicio del cuerpo
                        // Mejor: inyectar al final, pero antes del primer 'end'? Es complejo.
                        // Enfoque seguro: inyectar un bloque `if false then ... end` al inicio de la función.
                        // Lo haremos al encontrar el primer 'do' o '('?
                        // Para simplificar, inyectamos después de la línea 'function ...' y antes del primer 'local' o 'print'.
                        // Usaremos un marcador: cuando encontremos un 'do' o un salto de línea, insertamos.
                        // Mejor: inyectar al final de la función, justo antes del 'end' que cierra la función.
                        // Lo haremos más adelante.
                        continue;
                    }

                    // Inyectar código muerto justo antes del 'end' de función (si está activado)
                    if (opts.deadCode && t.type === 'IDENTIFIER' && t.value === 'end' && functionDepth > 0) {
                        // Insertar un bloque de código muerto
                        const chunk = deadPool[Math.floor(Math.random() * deadPool.length)];
                        output.push(' ' + chunk + ' ');
                        functionDepth--;
                        if (functionDepth === 0) inFunction = false;
                        output.push(t.value);
                        lastToken = t;
                        continue;
                    }

                    // Ofuscar números (expresión simple)
                    if (opts.numbers && t.type === 'NUMBER') {
                        const num = t.value;
                        if (/^[0-9]+$/.test(num)) {
                            const n = parseInt(num, 10);
                            if (!isNaN(n) && n >= 0 && n < 100000) {
                                // Expresión aleatoria: (a * b + c - c) con redondeo
                                const a = Math.floor(Math.random() * 10) + 2;
                                const b = Math.round(n / a);
                                const c = Math.floor(Math.random() * 10);
                                const expr = `(${a}*${b}+${c}-${c})`;
                                output.push(expr);
                                lastToken = t;
                                continue;
                            }
                        }
                        output.push(t.value);
                        lastToken = t;
                        continue;
                    }

                    // Ofuscar strings (string.char con bytes)
                    if (opts.strings && t.type === 'STRING') {
                        const raw = t.value;
                        const content = raw.substring(1, raw.length - 1);
                        if (content.length > 0) {
                            const bytes = [];
                            for (let i = 0; i < content.length; i++) {
                                bytes.push(content.charCodeAt(i));
                            }
                            if (bytes.length === 1) {
                                output.push('string.char(' + bytes[0] + ')');
                            } else {
                                // Dividir en grupos para no superar límite de argumentos
                                const chunks = [];
                                const chunkSize = 50;
                                for (let i = 0; i < bytes.length; i += chunkSize) {
                                    const chunk = bytes.slice(i, i + chunkSize);
                                    chunks.push('string.char(' + chunk.join(',') + ')');
                                }
                                if (chunks.length === 1) {
                                    output.push(chunks[0]);
                                } else {
                                    output.push('(' + chunks.join(' .. ') + ')');
                                }
                            }
                            lastToken = t;
                            continue;
                        } else {
                            output.push("''");
                            lastToken = t;
                            continue;
                        }
                    }

                    // Renombrar identificadores (solo locales y funciones declaradas)
                    if (opts.rename && t.type === 'IDENTIFIER') {
                        if (RESERVED.has(t.value)) {
                            output.push(t.value);
                            lastToken = t;
                            continue;
                        }
                        // Si está después de '.' o ':' -> campo de tabla, no renombrar
                        if (lastToken && lastToken.type === 'SYMBOL' && (lastToken.value === '.' || lastToken.value === ':')) {
                            output.push(t.value);
                            lastToken = t;
                            continue;
                        }
                        const newName = renameMap.get(t.value);
                        if (newName) {
                            output.push(newName);
                        } else {
                            output.push(t.value);
                        }
                        lastToken = t;
                        continue;
                    }

                    // Default
                    output.push(t.value);
                    lastToken = t;
                }

                let result = output.join('');

                // ---- Minificar ----
                if (opts.minify) {
                    result = result.replace(/\s+/g, ' ');
                    result = result.replace(/\s*([{}()\[\],;:])\s*/g, '$1');
                    result = result.replace(/\s*([+\-*/%^#~=<>])\s*/g, '$1');
                    result = result.replace(/\b(and|or|not|function|local|return|if|then|else|elseif|for|do|while|repeat|until|break|goto|end)\s+/g, '$1 ');
                    result = result.trim();
                }

                // ---- Anti-debugging (opcional) ----
                if (opts.antiDebug) {
                    const anti = `
                    local _ = (function() 
                        local _e = pcall(function() return debug.getinfo end) 
                        if _e then 
                            -- alterar algo inofensivo
                            local _t = {}
                            _t[1] = 1 
                        end 
                        return true 
                    end)()
                    `;
                    result = anti + '\n' + result;
                }

                return result || '-- (código vacío)';
            }

            // ================== AUXILIARES ==================
            function generateConfusingName(id) {
                const chars = ['l', 'I', '1', '0', 'O', 'o', 'i', 'j'];
                let name = '_';
                let n = id + 1;
                while (n > 0) {
                    name += chars[n % chars.length];
                    n = Math.floor(n / chars.length);
                }
                return name.length < 3 ? name + 'x' : name;
            }

            function generateDeadCodePool() {
                const templates = [
                    'if false then local _a = 1 end',
                    'do local _t = {1,2,3} _t[#_t+1] = 4 end',
                    'local _x = math.random() if _x > 2 then end',
                    'if false then for _i=1,10 do end end',
                    'local _ = string.char(72,105) if false then end',
                    'do local _a,_b = 1,2 _a = _a + _b end',
                    'if false then local _t = {} _t[1] = "dead" end',
                ];
                const pool = [];
                for (let i = 0; i < 20; i++) {
                    const tpl = templates[i % templates.length];
                    let variant = tpl.replace(/_([a-z])/g, () => generateConfusingName(Math.floor(Math.random() * 100)));
                    pool.push(variant);
                }
                return pool;
            }

            // ================== UI ==================
            const inputEl = document.getElementById('inputCode');
            const outputEl = document.getElementById('outputCode');
            const btnObfuscate = document.getElementById('btnObfuscate');
            const btnCopy = document.getElementById('btnCopy');
            const btnDownload = document.getElementById('btnDownload');
            const btnClear = document.getElementById('btnClear');
            const inputCount = document.getElementById('inputCount');
            const outputCount = document.getElementById('outputCount');
            const inputIndicator = document.getElementById('inputIndicator');
            const outputIndicator = document.getElementById('outputIndicator');
            const timeDisplay = document.getElementById('timeDisplay');
            const techniqueCount = document.getElementById('techniqueCount');
            const toastContainer = document.getElementById('toastContainer');

            const optRename = document.getElementById('optRename');
            const optStrings = document.getElementById('optStrings');
            const optNumbers = document.getElementById('optNumbers');
            const optDeadCode = document.getElementById('optDeadCode');
            const optAntiDebug = document.getElementById('optAntiDebug');

            let toastTimer = null;

            function updateCounts() {
                const inLines = inputEl.value.split('\n').length;
                const outLines = outputEl.value.split('\n').length;
                inputCount.textContent = inLines + ' líneas';
                outputCount.textContent = outLines + ' líneas';
                inputIndicator.className = 'indicator ' + (inLines > 0 ? 'active' : 'idle');
                outputIndicator.className = 'indicator ' + (outLines > 0 ? 'active' : 'idle');
            }

            function updateTechniqueCount() {
                let count = 0;
                if (optRename.checked) count++;
                if (optStrings.checked) count++;
                if (optNumbers.checked) count++;
                if (optDeadCode.checked) count++;
                if (optAntiDebug.checked) count++;
                techniqueCount.textContent = count;
            }

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
                toast.innerHTML = `<span class="toast-icon">${icon}</span> ${message}`;
                toastContainer.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 2800);
            }

            function doObfuscate() {
                const src = inputEl.value;
                if (!src.trim()) {
                    showToast('Escribe o pega código Lua primero', 'error');
                    return;
                }
                try {
                    const opts = {
                        rename: optRename.checked,
                        strings: optStrings.checked,
                        numbers: optNumbers.checked,
                        deadCode: optDeadCode.checked,
                        antiDebug: optAntiDebug.checked,
                        minify: true,
                    };
                    const start = performance.now();
                    const result = obfuscate(src, opts);
                    const end = performance.now();
                    outputEl.value = result;
                    updateCounts();
                    timeDisplay.textContent = (end - start).toFixed(1) + 'ms';
                    showToast(`Ofuscado en ${(end - start).toFixed(1)}ms`, 'success');
                } catch (e) {
                    showToast('Error: ' + e.message, 'error');
                    console.error(e);
                }
            }

            function copyOutput() {
                const text = outputEl.value;
                if (!text) { showToast('No hay código para copiar', 'error'); return; }
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Copiado al portapapeles', 'success');
                }).catch(() => {
                    outputEl.select();
                    document.execCommand('copy');
                    showToast('Copiado', 'success');
                });
            }

            function downloadOutput() {
                const text = outputEl.value;
                if (!text) { showToast('No hay código para descargar', 'error'); return; }
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ofuscado.lua';
                a.click();
                URL.revokeObjectURL(url);
                showToast('Descargado como ofuscado.lua', 'success');
            }

            function clearAll() {
                inputEl.value = '';
                outputEl.value = '';
                updateCounts();
                timeDisplay.textContent = '—';
                showToast('Limpiado', 'success');
            }

            // Eventos
            btnObfuscate.addEventListener('click', doObfuscate);
            btnCopy.addEventListener('click', copyOutput);
            btnDownload.addEventListener('click', downloadOutput);
            btnClear.addEventListener('click', clearAll);
            inputEl.addEventListener('input', updateCounts);
            outputEl.addEventListener('input', updateCounts);
            [optRename, optStrings, optNumbers, optDeadCode, optAntiDebug].forEach(el => {
                el.addEventListener('change', updateTechniqueCount);
            });
            inputEl.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    doObfuscate();
                }
            });

            // Inicializar
            updateCounts();
            updateTechniqueCount();
            timeDisplay.textContent = '—';
            setTimeout(doObfuscate, 200);

            // Polyfill clipboard
            if (!navigator.clipboard) {
                navigator.clipboard = {
                    writeText: function(text) {
                        return new Promise((resolve, reject) => {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            ta.style.position = 'fixed';
                            ta.style.opacity = '0';
                            document.body.appendChild(ta);
                            ta.select();
                            try { document.execCommand('copy'); resolve(); } catch (e) { reject(e); }
                            document.body.removeChild(ta);
                        });
                    }
                };
            }
        })();
    </script>
</body>
</html>
