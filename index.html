<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Script Obfuscator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 1.8rem;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .editor-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }

        .box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: #090d16;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease-in-out;
        }

        .btn-obfuscate {
            background-color: #0284c7;
            color: white;
        }

        .btn-obfuscate:hover {
            background-color: #0369a1;
        }

        .btn-copy {
            background-color: #334155;
            color: white;
        }

        .btn-copy:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 Emoji Obfuscator (Lua) 💀</h1>
    
    <div class="editor-container">
        <div class="box">
            <label for="inputScript">Script Original (Lua):</label>
            <textarea id="inputScript" placeholder="print('¡Hola Mundo!')"></textarea>
        </div>
        <div class="box">
            <label for="outputScript">Script Obfuscado:</label>
            <textarea id="outputScript" readonly placeholder="Tu script con emojis aparecerá aquí..."></textarea>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-obfuscate" onclick="obfuscateScript()">Obfuscar Script</button>
        <button class="btn-copy" onclick="copyOutput()">Copiar Resultado</button>
    </div>
</div>

<script>
    // Lista fija de 16 emojis para mapear la notación Hexadecimal (0-F)
    const EMOJI_MAP = [
        "🔥", "💀", "🤡", "🚀", "⚡", "✨", "🎉", "👑", 
        "🤖", "🎃", "👻", "👾", "💎", "🛡️", "⚔️", "🌀"
    ];

    function obfuscateScript() {
        const input = document.getElementById("inputScript").value;
        if (!input.trim()) {
            alert("Por favor ingresa un script válido para obfuscar.");
            return;
        }

        // Convertir string a bytes UTF-8
        const encoder = new TextEncoder();
        const bytes = encoder.encode(input);

        // Convertir cada byte a par de emojis (Hexadecimal)
        let emojiSequence = "";
        for (let i = 0; i < bytes.length; i++) {
            let hex = bytes[i].toString(16).padStart(2, '0');
            let high = parseInt(hex[0], 16);
            let low = parseInt(hex[1], 16);
            emojiSequence += EMOJI_MAP[high] + EMOJI_MAP[low];
        }

        // Construir el mapeo inverso para el loader de Lua
        let luaMapTable = "{\n";
        EMOJI_MAP.forEach((emoji, index) => {
            luaMapTable += `    ["${emoji}"] = ${index},\n`;
        });
        luaMapTable += "}";

        // Plantilla del Loader compatible con Lua 5.1+, Luau y Executors
        const luaLoader = `-- Obfuscated with Emoji Engine
local _E = "${emojiSequence}"
local _M = ${luaMapTable}

local function _D(_str)
    local _b = {}
    local _chars = {}
    for c in string.gmatch(_str, "[%z\1-\127\194-\244][\128-\191]*") do
        table.insert(_chars, c)
    end
    for i = 1, #_chars, 2 do
        local _h = _M[_chars[i]]
        local _l = _M[_chars[i+1]]
        if _h and _l then
            table.insert(_b, string.char(_h * 16 + _l))
        end
    end
    return table.concat(_b)
end

local _code = _D(_E)
local _run = loadstring or load
local _exec, _err = _run(_code)
if _exec then
    _exec()
else
    error("Error al ejecutar el script: " .. tostring(_err))
end`;

        document.getElementById("outputScript").value = luaLoader;
    }

    function copyOutput() {
        const output = document.getElementById("outputScript");
        if (!output.value) return;

        output.select();
        navigator.clipboard.writeText(output.value);
        alert("¡Script obfuscado copiado al portapapeles!");
    }
</script>

</body>
</html>
