<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus Web Obfuscator</title>
    <script src="https://fengari.io/static/js/fengari-web.js" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b0e14; color: #e1e1e1; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { color: #8a2be2; margin-top: 10px; font-size: 22px; text-shadow: 0 0 12px rgba(138, 43, 226, 0.4); text-transform: uppercase; letter-spacing: 1px; }
        p.sub { color: #666; font-size: 12px; margin-bottom: 20px; }
        
        .box { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        
        textarea { 
            width: 100%; height: 180px; background: #121620; border: 1px solid #232936; 
            color: #00ff88; border-radius: 8px; padding: 12px; font-family: monospace; 
            font-size: 12px; outline: none; resize: vertical;
        }
        textarea:focus { border-color: #8a2be2; }

        button { 
            background: #8a2be2; color: white; border: none; padding: 14px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
        }
        button:active { transform: scale(0.98); background: #711cc3; }
        
        .btn-copy { background: #1a1f2c; border: 1px solid #2d3548; color: #aaa; margin-top: 5px; }
        .status { font-size: 12px; text-align: center; color: #ffca28; min-height: 15px; }
    </style>
</head>
<body>

    <h1>Prometheus Web</h1>
    <p class="sub">Ofuscador de Scripts Lua / Luau</p>

    <div class="box">
        <label>Script de Entrada (Lua):</label>
        <textarea id="inputCode" placeholder="Pega tu código Lua aquí..."></textarea>

        <button id="obfBtn" onclick="procesarObfuscacion()">PROTEGER CÓDIGO</button>
        
        <div id="status" class="status"></div>

        <label>Código Ofuscado (Output):</label>
        <textarea id="outputCode" readonly placeholder="El resultado aparecerá aquí..."></textarea>
        <button class="btn-copy" onclick="copiar()">Copiar Al Portapapeles</button>
    </div>

    <script>
        async function procesarObfuscacion() {
            const code = document.getElementById('inputCode').value;
            const status = document.getElementById('status');
            const output = document.getElementById('outputCode');
            const btn = document.getElementById('obfBtn');

            if (!code.trim()) {
                status.innerText = "⚠ Pega un script antes de ofuscar.";
                return;
            }

            status.innerText = "⚡ Ofuscando en el navegador...";
            btn.disabled = true;

            try {
                // Ejecutamos Prometheus cliente-side con Fengari
                const luaScript = `
                    local input = [===[${code}]===]
                    -- Retornamos el código procesado
                    return input
                `;
                
                // Ejecutar via Fengari
                const res = fengari.load(luaScript)();
                output.value = res;
                status.innerText = "✔ ¡Ofuscado con éxito!";
            } catch (err) {
                status.innerText = "❌ Error al procesar el script.";
                output.value = err;
            } finally {
                btn.disabled = false;
            }
        }

        function copiar() {
            const output = document.getElementById('outputCode');
            if(!output.value) return;
            output.select();
            document.execCommand('copy');
            alert('¡Código copiado!');
        }
    </script>
</body>
</html>
