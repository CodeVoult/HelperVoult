<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚡ LuaShield · Ofuscador Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET + BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #080a0f;
            --bg-secondary: #0e111a;
            --bg-panel: rgba(18, 22, 33, 0.72);
            --border-glass: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f2f8;
            --text-secondary: #8b93b5;
            --accent-start: #6c5ce7;
            --accent-end: #00b4d8;
            --accent-glow: rgba(108, 92, 231, 0.35);
            --shadow-glass: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 30% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 60%),
                              radial-gradient(ellipse at 70% 80%, rgba(0, 180, 216, 0.06) 0%, transparent 50%);
        }
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2f45;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d4470;
        }

        /* ===== CONTAINER ===== */
        .app {
            width: 100%;
            max-width: 1480px;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0 28px;
            flex-wrap: wrap;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 24px var(--accent-glow);
            flex-shrink: 0;
        }
        .logo-text {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #b8bfff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text span {
            font-weight: 400;
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-badge {
            background: rgba(108, 92, 231, 0.15);
            border: 1px solid rgba(108, 92, 231, 0.25);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #b4b9e6;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            display: inline-block;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ===== OPTIONS BAR ===== */
        .options-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 28px;
            padding: 16px 24px;
            margin: 20px 0 24px;
            background: var(--bg-panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            box-shadow: var(--shadow-glass);
        }
        .option-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .option-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
        }
        .option-group label:hover {
            color: #d0d5ee;
        }
        .option-group input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 2px solid #363c5a;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .option-group input[type="checkbox"]:checked {
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            border-color: transparent;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .option-group input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.3s;
            background: radial-gradient(circle at center, rgba(255,255,255,0.06) 0%, transparent 70%);
        }
        .btn:hover::after {
            opacity: 1;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            color: #fff;
            box-shadow: 0 4px 24px var(--accent-glow);
            border: none;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 36px rgba(108, 92, 231, 0.5);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        .btn-ghost {
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.12);
            color: #fff;
        }
        .btn-danger {
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.15);
        }
        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.08);
            border-color: rgba(248, 113, 113, 0.3);
        }

        /* ===== EDITOR GRID ===== */
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }
        @media (max-width: 880px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            box-shadow: var(--shadow-glass);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.3s;
        }
        .panel:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }
        .panel-header .count {
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: #6b73a5;
            font-variant-numeric: tabular-nums;
        }
        .panel-header .badge-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-header .badge-status .indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .indicator.idle { background: #4b5563; }
        .indicator.active { background: #4ade80; box-shadow: 0 0 12px rgba(74, 222, 128, 0.4); animation: pulse-dot 1.5s ease-in-out infinite; }

        .panel textarea {
            width: 100%;
            min-height: 520px;
            padding: 18px 20px;
            background: transparent;
            border: none;
            color: #e4e8f5;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.7;
            resize: vertical;
            outline: none;
            tab-size: 4;
            transition: background 0.2s;
        }
        .panel textarea::placeholder {
            color: #3a4060;
        }
        .panel textarea:focus {
            background: rgba(255, 255, 255, 0.01);
        }
        .panel textarea[readonly] {
            cursor: default;
            color: #c8cff0;
        }

        /* ===== FOOTER ===== */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 10px;
            font-size: 13px;
            color: #3d4468;
            flex-wrap: wrap;
            gap: 10px;
        }
        .footer .stats {
            display: flex;
            gap: 24px;
        }
        .footer .stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer .key-hint {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .footer .key-hint kbd {
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
            color: #8b93b5;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 32px;
            right: 32px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 999;
            pointer-events: none;
        }
        .toast {
            background: rgba(14, 17, 26, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            color: #e4e8f5;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
            transform: translateX(60px) scale(0.96);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 220px;
        }
        .toast.show {
            transform: translateX(0) scale(1);
            opacity: 1;
        }
        .toast.success { border-left: 3px solid #4ade80; }
        .toast.error { border-left: 3px solid #f87171; }
        .toast .toast-icon {
            font-size: 18px;
        }

        /* ===== RESPONSIVE TWEAKS ===== */
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .options-bar { flex-direction: column; align-items: stretch; }
            .btn-group { margin-left: 0; justify-content: stretch; }
            .btn-group .btn { flex: 1; justify-content: center; }
            .panel textarea { min-height: 340px; font-size: 13px; }
            .footer { flex-direction: column; align-items: flex-start; }
            .toast-container { bottom: 16px; right: 16px; left: 16px; }
            .toast { width: 100%; }
        }
        @media (max-width: 400px) {
            .logo-text { font-size: 20px; }
            .header-badge { font-size: 11px; padding: 4px 12px; }
            .option-group label { font-size: 12px; }
        }

        /* ===== LOADING SHIMMER ===== */
        .shimmer {
            background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,0.03) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmer 2.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== KEYFRAME UTILITY ===== */
        .fade-in {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.10s; }
        .delay-3 { animation-delay: 0.15s; }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="logo-icon">🛡️</div>
                <div class="logo-text">Lua<span>Shield</span></div>
            </div>
            <div class="header-badge">
                <span class="dot"></span>
                <span>100% local · sin servidor</span>
            </div>
        </header>

        <!-- OPTIONS -->
        <div class="options-bar">
            <div class="option-group">
                <label><input type="checkbox" id="optRename" checked /> Renombrar</label>
                <label><input type="checkbox" id="optStrings" checked /> Ofuscar strings</label>
                <label><input type="checkbox" id="optNumbers" checked /> Ofuscar números</label>

                <button class="btn btn-ghost" id="btnDownload">⬇️ Descargar</button>

        <!-- EDITORS -->
        <div class="editor-grid">
            <div class="panel fade-in delay-1">

                    <span>📝 Código fuente</span>
                    <div class="badge-status">
                        <span class="indicator idle" id="inputIndicator"></span>
                        <span class="count" id="inputCount">0 líneas</span>
                    </div>
                </div>
                <textarea id="inputCode" spellcheck="false" placeholder="-- Escribe o pega tu script Lua aquí...&#10;local saludo = &quot;Hola mundo&quot;&#10;function prueba(x)&#10;    return x * 2&#10;end">-- ============================================ -- 
--  EJEMPLO AVANZADO  --
-- ============================================ --

local jugador = "Arthas"
local nivel = 85
local inventario = {"Espada", "Escudo", "Poción"}

function saludar(nombre)
    print("¡Bienvenido, " .. nombre .. "!")
    return true
end

local function calcular_daño(base, multiplicador)

    if critico then
        daño = daño * 2

function atacar(objetivo)

    print("Atacaste a " .. objetivo .. " por " .. daño .. " de daño")

end

-- Bucle principal
for i = 1, 5 do
    local resultado = atacar("Murloc " .. i)
    if resultado > 100 then
        print("¡Eliminaste al Murloc!")
    end
end

print("¡Fin del combate!")</textarea>

            <div class="panel fade-in delay-2">
                <div class="panel-header">
                    <span>🔮 Código ofuscado</span>

                        <span class="indicator idle" id="outputIndicator"></span>

        <div class="footer">

                <span>⚙️ <span id="techniqueCount">5</span> técnicas activas</span>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  1.  CONFIGURACIÓN
            // ================================================================
            const KEYWORDS = new Set([
                'and', 'break', 'do', 'else', 'elseif', 'end', 'false', 'for',
                'function', 'goto', 'if', 'in', 'local', 'nil', 'not', 'or',
                'repeat', 'return', 'then', 'true', 'until', 'while'
            ]);
            const BUILTINS = new Set([
                '_G', '_VERSION', 'arg', 'assert', 'collectgarbage', 'coroutine',
                'debug', 'dofile', 'error', 'getfenv', 'getmetatable', 'io',
                'ipairs', 'load', 'loadfile', 'loadstring', 'math', 'next', 'os',
                'package', 'pairs', 'print', 'rawequal', 'rawget', 'rawlen',
                'rawset', 'select', 'setfenv', 'setmetatable', 'string', 'table',
                'tonumber', 'tostring', 'type', 'xpcall', 'utf8', 'wait', 'tick',
                'spawn', 'delay', 'task', 'Instance', 'game', 'workspace', 'script'
            ]);
            const RESERVED = new Set([...KEYWORDS, ...BUILTINS]);

            // ================================================================
            //  2.  TOKENIZER MEJORADO
            // ================================================================
            function tokenize(code) {
                const tokens = [];
                let i = 0;
                const n = code.length;

                while (i < n) {
                    const ch = code[i];

                    // Whitespace
                    if (/\s/.test(ch)) {
                        let val = '';
                        while (i < n && /\s/.test(code[i])) { val += code[i]; i++; }
                        tokens.push({ type: 'WHITESPACE', value: val });
                        continue;
                    }

                    // Comentario de línea --
                    if (ch === '-' && i + 1 < n && code[i + 1] === '-') {
                        const next2 = (i + 2 < n) ? code[i + 2] : '';
                        // Comentario largo --[[ ... ]]
                        if (next2 === '[' && i + 3 < n && code[i + 3] === '[') {
                            const start = i;
                            i += 4;
                            while (i + 1 < n && !(code[i] === ']' && code[i + 1] === ']')) i++;
                            i += 2;
                            tokens.push({ type: 'COMMENT', value: code.substring(start, i) });
                            continue;
                        } else {
                            const start = i;
                            i += 2;
                            while (i < n && code[i] !== '\n' && code[i] !== '\r') i++;
                            tokens.push({ type: 'COMMENT', value: code.substring(start, i) });
                            continue;
                        }
                    }

                    // Strings: "..." o '...'
                    if (ch === '"' || ch === "'") {
                        const quote = ch;
                        const start = i;
                        i++;
                        while (i < n && code[i] !== quote) {
                            if (code[i] === '\\' && i + 1 < n) i += 2;
                            else i++;
                        }
                        if (i < n && code[i] === quote) i++;
                        tokens.push({ type: 'STRING', value: code.substring(start, i) });
                        continue;
                    }

                    // Long string [[ ... ]]
                    if (ch === '[' && i + 1 < n && code[i + 1] === '[') {
                        const start = i;
                        i += 2;
                        while (i + 1 < n && !(code[i] === ']' && code[i + 1] === ']')) i++;
                        i += 2;
                        tokens.push({ type: 'STRING', value: code.substring(start, i) });
                        continue;
                    }

                    // Números (incluyendo hexadecimales)
                    if (/[0-9]/.test(ch) || (ch === '.' && i + 1 < n && /[0-9]/.test(code[i + 1]))) {
                        let val = '';
                        while (i < n && /[0-9a-fA-FxX.]/.test(code[i])) { val += code[i]; i++; }
                        tokens.push({ type: 'NUMBER', value: val });
                        continue;
                    }

                    // Identificadores
                    if (/[a-zA-Z_]/.test(ch)) {
                        let val = '';
                        while (i < n && /[a-zA-Z0-9_]/.test(code[i])) { val += code[i]; i++; }
                        tokens.push({ type: 'IDENTIFIER', value: val });
                        continue;
                    }

                    // Símbolos multi-carácter
                    const multi = {
                        '~=': true, '>=': true, '<=': true, '==': true,
                        '..': true, '...': true, '<<': true, '>>': true,
                        '//': true, '/*': true, '*/': true
                    };
                    if (i + 1 < n) {
                        const two = ch + code[i + 1];
                        if (multi[two]) {
                            tokens.push({ type: 'SYMBOL', value: two });
                            i += 2;
                            continue;
                        }
                    }
                    tokens.push({ type: 'SYMBOL', value: ch });
                    i++;
                }
                return tokens;
            }

            // ================================================================
            //  3.  OFUSCADOR PRINCIPAL
            // ================================================================
            function obfuscate(code, opts) {
                const tokens = tokenize(code);
                const output = [];
                const renameMap = new Map();
                let nextId = 0;
                let lastToken = null;

                // ---- PASADA 1: Recolectar nombres a renombrar ----
                if (opts.rename) {
                    for (let idx = 0; idx < tokens.length; idx++) {
                        const t = tokens[idx];
                        // local VAR
                        if (t.type === 'IDENTIFIER' && t.value === 'local') {
                            let j = idx + 1;
                            while (j < tokens.length && tokens[j].type === 'WHITESPACE') j++;
                            if (j < tokens.length && tokens[j].type === 'IDENTIFIER') {
                                const name = tokens[j].value;
                                if (!RESERVED.has(name) && !renameMap.has(name)) {
                                    renameMap.set(name, generateConfusingName(nextId++));
                                }
                            }
                        }
                        // function NAME
                        if (t.type === 'IDENTIFIER' && t.value === 'function') {
                            let j = idx + 1;
                            while (j < tokens.length && tokens[j].type === 'WHITESPACE') j++;
                            if (j < tokens.length && tokens[j].type === 'IDENTIFIER') {
                                const name = tokens[j].value;
                                if (!RESERVED.has(name) && !renameMap.has(name)) {
                                    renameMap.set(name, generateConfusingName(nextId++));
                                }
                            }
                        }
                        // Asignación global: VAR = ...
                        if (t.type === 'IDENTIFIER' && !RESERVED.has(t.value)) {
                            // Si no es local y no está en una posición donde se declare local, es global
                            // Verificamos si está precedido por 'local'
                            let isLocal = false;
                            let k = idx - 1;
                            while (k >= 0 && tokens[k].type === 'WHITESPACE') k--;
                            if (k >= 0 && tokens[k].type === 'IDENTIFIER' && tokens[k].value === 'local') {
                                isLocal = true;
                            }
                            if (!isLocal && !renameMap.has(t.value)) {
                                // Solo renombrar si no es una palabra reservada y no está después de '.' o ':'
                                let prev = idx - 1;
                                while (prev >= 0 && tokens[prev].type === 'WHITESPACE') prev--;
                                if (prev >= 0 && tokens[prev].type === 'SYMBOL' && (tokens[prev].value === '.' || tokens[
                                    prev].value === ':')) {
                                    // es campo de tabla, no renombrar
                                } else {
                                    renameMap.set(t.value, generateConfusingName(nextId++));
                                }
                            }
                        }
                    }
                }

                // ---- PASADA 2: Generar salida ----
                let deadCodePool = [];
                if (opts.deadCode) {
                    deadCodePool = generateDeadCodePool();
                }

                let deadIndex = 0;
                let inFunction = false;
                let functionDepth = 0;

                for (let idx = 0; idx < tokens.length; idx++) {
                    const t = tokens[idx];

                    // ---- Minificar: saltar comentarios ----
                    if (opts.minify && t.type === 'COMMENT') {
                        continue;
                    }

                    // ---- Inyección de código muerto (dentro de funciones) ----
                    if (opts.deadCode && deadCodePool.length > 0) {
                        if (t.type === 'IDENTIFIER' && t.value === 'function') {
                            functionDepth++;
                            inFunction = true;
                        }
                        if (t.type === 'IDENTIFIER' && t.value === 'end' && functionDepth > 0) {
                            functionDepth--;
                            if (functionDepth === 0) inFunction = false;
                            // Inyectar código muerto justo antes del 'end' de una función
                            if (opts.deadCode && deadCodePool.length > 0) {
                                const chunk = deadCodePool[deadIndex % deadCodePool.length];
                                deadIndex++;
                                output.push(' ' + chunk + ' ');
                            }
                        }
                    }

                    // ---- Ofuscar números ----
                    if (opts.numbers && t.type === 'NUMBER') {
                        const num = t.value;
                        if (/^[0-9]+$/.test(num)) {
                            const n = parseInt(num, 10);
                            if (!isNaN(n) && n >= 0 && n < 100000) {
                                // Ofuscación con expresión matemática
                                const a = Math.floor(Math.random() * 20) + 3;
                                const b = Math.floor(Math.random() * 10) + 1;
                                const expr = `(${a}*${Math.round(n/a)}+${b}-${b})`;
                                output.push(expr);
                                lastToken = t;
                                continue;
                            }
                        }
                        output.push(t.value);
                        lastToken = t;
                        continue;
                    }

                    // ---- Ofuscar strings (multi-capa) ----
                    if (opts.strings && t.type === 'STRING') {
                        const raw = t.value;
                        const content = raw.substring(1, raw.length - 1);
                        if (content.length > 0 && content.length < 200) {
                            const encoded = encodeStringAdvanced(content);
                            output.push(encoded);
                            lastToken = t;
                            continue;
                        } else if (content.length >= 200) {
                            // Split largo
                            const parts = splitString(content, 40);
                            const joined = parts.map(p => encodeStringAdvanced(p)).join(' .. ');
                            output.push('(' + joined + ')');
                            lastToken = t;
                            continue;
                        } else {
                            output.push("''");
                            lastToken = t;
                            continue;
                        }
                    }

                    // ---- Renombrar identificadores ----
                    if (opts.rename && t.type === 'IDENTIFIER') {
                        if (RESERVED.has(t.value)) {
                            output.push(t.value);
                            lastToken = t;
                            continue;
                        }
                        // Si está después de '.' o ':' -> campo de tabla, no renombrar
                        if (lastToken && lastToken.type === 'SYMBOL' && (lastToken.value === '.' || lastToken.value ===
                            ':')) {
                            output.push(t.value);
                            lastToken = t;
                            continue;
                        }
                        const newName = renameMap.get(t.value);
                        if (newName) {
                            output.push(newName);
                        } else {
                            output.push(t.value);
                        }
                        lastToken = t;
                        continue;
                    }

                    // ---- Ofuscar flujo (goto-based) ----
                    if (opts.flow && t.type === 'IDENTIFIER' && t.value === 'function') {
                        // Insertar marcador para ofuscación de flujo
                        // (implementación simplificada: añadimos saltos aleatorios)
                        if (Math.random() > 0.6) {
                            const label = '_L' + Math.floor(Math.random() * 9999);
                            output.push('function() local ' + label + ' = true ');
                            // Inyectamos un goto si es compatible
                            // Nota: goto es Lua 5.2+, pero lo dejamos como comentario para no romper
                            // En su lugar, añadimos código muerto con condiciones
                            output.push('if false then end ');
                        }
                        output.push(t.value);
                        lastToken = t;
                        continue;
                    }

                    // ---- Default ----
                    output.push(t.value);
                    lastToken = t;
                }

                let result = output.join('');

                // ---- Minificar final ----
                if (opts.minify) {
                    result = result.replace(/\s+/g, ' ');
                    result = result.replace(/\s*([{}()\[\],;:])\s*/g, '$1');
                    result = result.replace(/\s*([+\-*/%^#~=<>])\s*/g, '$1');
                    result = result.replace(/\b(and|or|not|function|local|return|if|then|else|elseif|for|do|while|repeat|until|break|goto|end)\s+/g,
                        '$1 ');
                    result = result.trim();
                }

                // ---- Anti-debugging (opcional) ----
                // Añadir una comprobación simple al inicio
                if (opts.strings) {
                    const antiDebug = `
                    local _ = (function() 
                        local _e = debug and debug.getinfo 
                        if _e then 
                            local _t = { } 
                            _t[1] = 1 
                        end 
                        return true 
                    end)()
                    `;
                    result = antiDebug + '\n' + result;
                }

                return result || '-- (código vacío)';
            }

            // ================================================================
            //  4.  FUNCIONES AUXILIARES
            // ================================================================

            // Genera nombres confusos estilo "lI1lI0O"
            function generateConfusingName(id) {
                const chars = ['l', 'I', '1', '0', 'O', 'o', 'i', 'j'];
                let name = '_';
                let n = id + 1;
                while (n > 0) {
                    name += chars[n % chars.length];
                    n = Math.floor(n / chars.length);
                }
                return name.length < 3 ? name + 'x' : name;
            }

            // Codificación avanzada de strings (XOR + string.char)
            function encodeStringAdvanced(str) {
                // Convertir a bytes
                const bytes = [];
                for (let i = 0; i < str.length; i++) {
                    bytes.push(str.charCodeAt(i));
                }
                if (bytes.length === 0) return "''";
                if (bytes.length === 1) return "string.char(" + bytes[0] + ")";

                // Aplicar XOR con clave aleatoria
                const key = Math.floor(Math.random() * 255) + 1;
                const xored = bytes.map(b => b ^ key);

                // Construir expresión: (function(k) return string.char(...) end)(KEY)
                const parts = xored.map(b => b.toString(10));
                const charCall = 'string.char(' + parts.join(',') + ')';
                // Aplicar XOR en runtime
                const expr = `(function(k) local s= {...} local r=string.char; local t={} for i=1,#s do t[i]=r(s[i]~k) end return table.concat(t) end)(` +
                    key + `,` + parts.join(',') + `)`;

                // A veces usar base64 simulado (solo para strings cortos)
                if (str.length < 20 && Math.random() > 0.5) {
                    // Codificación simple: usar string.char con operaciones matemáticas
                    const m = bytes.map(b => `(${b}+${Math.floor(Math.random()*5)}-${Math.floor(Math.random()*5)})`);
                    return 'string.char(' + m.join(',') + ')';
                }

                return expr;
            }

            // Divide un string largo en partes
            function splitString(str, chunkSize) {
                const parts = [];
                for (let i = 0; i < str.length; i += chunkSize) {
                    parts.push(str.substring(i, i + chunkSize));
                }
                return parts;
            }

            // Genera pool de código muerto
            function generateDeadCodePool() {
                const pool = [];
                const templates = [
                    'if false then local _a = 1 end',
                    'local _z = (function() return 0 end)() if _z > 1 then print("x") end',
                    'do local _t = {1,2,3} _t[#_t+1] = 4 end',
                    'local _x = math.random() if _x > 2 then end',
                    'if false then for _i=1,10 do end end',
                    'local _ = string.char(72,105) if false then end',
                    'do local _a,_b = 1,2 _a = _a + _b end',
                    'if false then local _t = {} _t[1] = "dead" end',
                    'local _n = 0 while _n > 1 do _n = _n - 1 end',
                    'if false then repeat _n = _n + 1 until _n > 10 end',
                ];
                // Añadir variaciones con nombres confusos
                for (let i = 0; i < 20; i++) {
                    const tpl = templates[i % templates.length];
                    // Reemplazar nombres con variantes
                    let variant = tpl.replace(/_([a-z])/g, (m, p) => {
                        return generateConfusingName(Math.floor(Math.random() * 100));
                    });
                    pool.push(variant);
                }
                return pool;
            }

            // ================================================================
            //  5.  UI
            // ================================================================
            const inputEl = document.getElementById('inputCode');
            const outputEl = document.getElementById('outputCode');
            const btnObfuscate = document.getElementById('btnObfuscate');
            const btnCopy = document.getElementById('btnCopy');
            const btnDownload = document.getElementById('btnDownload');
            const btnClear = document.getElementById('btnClear');
            const inputCount = document.getElementById('inputCount');
            const outputCount = document.getElementById('outputCount');
            const inputIndicator = document.getElementById('inputIndicator');
            const outputIndicator = document.getElementById('outputIndicator');
            const timeDisplay = document.getElementById('timeDisplay');
            const techniqueCount = document.getElementById('techniqueCount');
            const toastContainer = document.getElementById('toastContainer');

            const optRename = document.getElementById('optRename');
            const optStrings = document.getElementById('optStrings');
            const optNumbers = document.getElementById('optNumbers');
            const optFlow = document.getElementById('optFlow');
            const optDeadCode = document.getElementById('optDeadCode');

            let toastTimer = null;

            function updateCounts() {
                const inLines = inputEl.value.split('\n').length;
                const outLines = outputEl.value.split('\n').length;
                inputCount.textContent = inLines + ' líneas';
                outputCount.textContent = outLines + ' líneas';
                inputIndicator.className = 'indicator ' + (inLines > 0 ? 'active' : 'idle');
                outputIndicator.className = 'indicator ' + (outLines > 0 ? 'active' : 'idle');
            }

            function updateTechniqueCount() {
                let count = 0;
                if (optRename.checked) count++;
                if (optStrings.checked) count++;
                if (optNumbers.checked) count++;
                if (optFlow.checked) count++;
                if (optDeadCode.checked) count++;
                techniqueCount.textContent = count;
            }

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
                toast.innerHTML = `<span class="toast-icon">${icon}</span> ${message}`;
                toastContainer.appendChild(toast);
                // Trigger show
                requestAnimationFrame(() => {
                    toast.classList.add('show');
                });
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 2800);
            }

            function doObfuscate() {
                const src = inputEl.value;
                if (!src.trim()) {
                    showToast('Escribe o pega código Lua primero', 'error');
                    return;
                }
                try {
                    const opts = {
                        rename: optRename.checked,
                        strings: optStrings.checked,
                        numbers: optNumbers.checked,
                        flow: optFlow.checked,
                        deadCode: optDeadCode.checked,
                        minify: true, // siempre minificar
                    };
                    const start = performance.now();
                    const result = obfuscate(src, opts);
                    const end = performance.now();
                    outputEl.value = result;
                    updateCounts();
                    timeDisplay.textContent = (end - start).toFixed(1) + 'ms';
                    showToast(`Ofuscado en ${(end - start).toFixed(1)}ms`, 'success');
                } catch (e) {
                    showToast('Error: ' + e.message, 'error');
                    console.error(e);
                }
            }

            function copyOutput() {
                const text = outputEl.value;
                if (!text) { showToast('No hay código para copiar', 'error'); return; }
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Copiado al portapapeles', 'success');
                }).catch(() => {
                    outputEl.select();
                    document.execCommand('copy');
                    showToast('Copiado', 'success');
                });
            }

            function downloadOutput() {
                const text = outputEl.value;
                if (!text) { showToast('No hay código para descargar', 'error'); return; }
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ofuscado.lua';
                a.click();
                URL.revokeObjectURL(url);
                showToast('Descargado como ofuscado.lua', 'success');
            }

            function clearAll() {
                inputEl.value = '';
                outputEl.value = '';
                updateCounts();
                timeDisplay.textContent = '—';
                showToast('Limpiado', 'success');
            }

            // ---- Eventos ----
            btnObfuscate.addEventListener('click', doObfuscate);
            btnCopy.addEventListener('click', copyOutput);
            btnDownload.addEventListener('click', downloadOutput);
            btnClear.addEventListener('click', clearAll);

            inputEl.addEventListener('input', updateCounts);
            outputEl.addEventListener('input', updateCounts);

            // Actualizar contador de técnicas
            [optRename, optStrings, optNumbers, optFlow, optDeadCode].forEach(el => {
                el.addEventListener('change', updateTechniqueCount);
            });

            // Ctrl+Enter
            inputEl.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    doObfuscate();
                }
            });

            // ---- Inicializar ----
            updateCounts();
            updateTechniqueCount();
            timeDisplay.textContent = '—';

            // Ofuscar el ejemplo al cargar
            setTimeout(doObfuscate, 200);

            // Exponer para depuración
            window.__obfuscate = obfuscate;

            // ================================================================
            //  6.  POLYFILL para navigator.clipboard en entornos no seguros
            // ================================================================
            if (!navigator.clipboard) {
                navigator.clipboard = {
                    writeText: function(text) {
                        return new Promise((resolve, reject) => {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            ta.style.position = 'fixed';
                            ta.style.opacity = '0';
                            document.body.appendChild(ta);
                            ta.select();
                            try {
                                document.execCommand('copy');
                                resolve();
                            } catch (e) {
                                reject(e);
                            }
                            document.body.removeChild(ta);
                        });
                    }
                };
            }

        })();
    </script>
